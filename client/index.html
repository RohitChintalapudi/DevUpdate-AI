<!doctype html>
<html lang="en" data-theme="daylight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B14" />
    <meta
      name="description"
      content="DevUpdate AI — AI-powered GitHub dependency intelligence. Monitor updates, understand release notes and make smarter upgrade decisions."
    />
    <script>
      try {
        const pref = JSON.parse(localStorage.getItem('devupdate:appearance') || '{}').theme || 'daylight'
        const dark = pref === 'midnight' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'midnight' : 'daylight'
        document.documentElement.dataset.themePreference = pref
        document.querySelector('meta[name="theme-color"]').content = dark ? '#080B14' : '#F8FAFC'
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>DevUpdate AI — Dependency Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
